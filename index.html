<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Torchlight</title>
  <style>
    body { background: #101014; color: #cfc9bd; font-family: ui-monospace, Menlo, monospace; display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
    h1 { font-size: 18px; letter-spacing: 0.2em; margin: 0; color: #e8b56a; }
    #stage { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
    /* The framebuffer is 320x200; scale it up with nearest-neighbour so the software pixels stay crisp. */
    canvas#view { width: 960px; max-width: 90vw; image-rendering: pixelated; background: #000; border: 1px solid #333; }
    #debug-panel { min-width: 180px; display: flex; flex-direction: column; gap: 8px; font-size: 12px; }
    #debug-panel fieldset { border: 1px solid #333; }
    .help { font-size: 12px; color: #7d7668; }
    a { color: #e8b56a; }
  </style>
</head>
<body>
  <h1>TORCHLIGHT</h1>
  <div id="stage">
    <div style="position: relative;">
      <canvas id="view" width="320" height="200"></canvas>
      <!-- Top-down minimap (roadmap E6): the 2D grid the raycaster projects from, made
           visible next to the 3D view. Sized at runtime in main.ts from the actual map
           dimensions; drawn as flat 2D canvas UI, not part of the lit framebuffer pipeline. -->
      <canvas id="minimap" style="position: absolute; top: 8px; right: 8px; image-rendering: pixelated; background: rgba(10, 8, 4, 0.55); border: 1px solid rgba(232, 181, 106, 0.3); border-radius: 4px;"></canvas>
      <!-- In-game HUD, classic corner-overlay style: translucent plate so the scene
           reads through it; icons are painted at runtime from the sprite texel code. -->
      <div id="hud" style="position: absolute; left: 10px; bottom: 10px; display: flex; align-items: center; gap: 16px; padding: 7px 12px; background: rgba(10, 8, 4, 0.5); border: 1px solid rgba(232, 181, 106, 0.3); border-radius: 4px; color: #e8b56a; font-size: 17px; user-select: none; pointer-events: none;">
        <span id="hud-hearts" style="display: flex; align-items: center; gap: 2px;">
          <canvas id="hud-heart-0" width="18" height="16" style="image-rendering: pixelated;"></canvas>
          <canvas id="hud-heart-1" width="18" height="16" style="image-rendering: pixelated;"></canvas>
          <canvas id="hud-heart-2" width="18" height="16" style="image-rendering: pixelated;"></canvas>
        </span>
        <span style="display: flex; align-items: center; gap: 7px;">
          <canvas id="hud-gem" width="16" height="22" style="image-rendering: pixelated;"></canvas>
          <span id="hud-gems">0/0</span>
        </span>
        <canvas id="hud-key" width="24" height="24" style="image-rendering: pixelated;"></canvas>
        <span style="display: flex; align-items: center; gap: 5px;">
          <canvas id="hud-fireball" width="16" height="16" style="image-rendering: pixelated;"></canvas>
          <span id="hud-fireball-bar" style="width: 34px; height: 6px; background: rgba(255,255,255,0.12); border-radius: 3px; overflow: hidden; display: inline-block;">
            <span id="hud-fireball-fill" style="display: block; height: 100%; width: 100%; background: #e8935a;"></span>
          </span>
        </span>
        <span id="hud-seed" style="font-size: 11px; color: rgba(207, 201, 189, 0.55);"></span>
      </div>
      <div id="win-overlay" style="display: none; position: absolute; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 8px; background: rgba(8, 6, 2, 0.75); color: #e8b56a; font-size: 28px; letter-spacing: 0.15em; text-align: center;">
        YOU ESCAPED
        <span style="font-size: 13px; color: #cfc9bd;">the vault key served you well</span>
      </div>
      <div id="death-overlay" style="display: none; position: absolute; inset: 0; align-items: center; justify-content: center; flex-direction: column; gap: 8px; background: rgba(30, 4, 4, 0.78); color: #e88a6a; font-size: 28px; letter-spacing: 0.15em; text-align: center;">
        YOU DIED
        <span id="death-seed" style="font-size: 13px; color: #cfc9bd;"></span>
        <span style="font-size: 13px; color: #cfc9bd;">press R to retry</span>
      </div>
    </div>
    <div id="debug-panel"></div>
  </div>
  <p class="help">WASD move &middot; &larr;/&rarr; or Q/E turn &middot; Shift run &middot; Space swing &middot; F fireball &middot; V dash &middot; <a href="/harness.html">material harness</a></p>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
